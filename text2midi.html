<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Text → MIDI (Client-side)</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding: 24px; background:#f7fafc; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 6px 18px rgba(2,6,23,0.08); max-width:900px; margin:auto }
    label { display:block; margin-top:12px; font-weight:600 }
    input[type=text], input[type=number], select, textarea { width:100%; padding:8px 10px; margin-top:6px; border-radius:8px; border:1px solid #e2e8f0 }
    .row { display:flex; gap:12px }
    .col { flex:1 }
    .small { max-width:160px }
    button { margin-top:16px; background:#2563eb; color:white; padding:10px 14px; border-radius:8px; border:none; cursor:pointer }
    .muted { color:#6b7280; font-size:13px }
    .note { margin-top:10px; padding:10px; background:#fff7ed; border-radius:8px; border:1px solid #ffedd5 }
    pre { background:#f1f5f9; padding:10px; border-radius:8px }
  </style>
</head>
<body>
  <div class="card">
    <h1>Text → MIDI (Browser-only)</h1>
    <p class="muted">Everything runs in your browser — no server. Fill the form and click <strong>Generate MIDI</strong>.</p>

    <label for="text">Text to convert</label>
    <textarea id="text" rows="6" placeholder="Type or paste the text to convert">Hello World! This is a browser-only Text→MIDI demo.</textarea>

    <div class="row">
      <div class="col">
        <label for="output">Output filename</label>
        <input id="output" type="text" value="output.mid" />
      </div>
      <div class="col small">
        <label for="bpm">BPM</label>
        <input id="bpm" type="number" min="20" max="400" value="120" />
      </div>
      <div class="col small">
        <label for="note_length">Note length (beats)</label>
        <input id="note_length" type="number" step="0.25" value="1.0" />
      </div>
    </div>

    <div class="row">
      <div class="col small">
        <label for="base_midi">Base MIDI (root)</label>
        <input id="base_midi" type="number" value="60" />
      </div>
      <div class="col small">
        <label for="base_octave">Base octave</label>
        <input id="base_octave" type="number" value="4" />
      </div>
      <div class="col small">
        <label for="program">Program (instrument)</label>
        <input id="program" type="number" min="0" max="127" value="0" />
      </div>
      <div class="col small">
        <label for="ticks">Ticks/beat</label>
        <input id="ticks" type="number" value="480" />
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="scale">Scale</label>
        <select id="scale">
          <option value="major">major</option>
          <option value="minor">minor</option>
          <option value="pentatonic">pentatonic</option>
          <option value="chromatic">chromatic</option>
        </select>
      </div>

      <div class="col small">
        <label for="division">Division (grid)</label>
        <select id="division">
          <option value="1">1 (whole)</option>
          <option value="1.">1. (dotted whole)</option>
          <option value="1/2">1/2 (half)</option>
          <option value="1/2.">1/2. (dotted half)</option>
          <option value="1/4">1/4 (quarter)</option>
          <option value="1/4.">1/4. (dotted quarter)</option>
          <option value="1/8">1/8 (eighth)</option>
          <option value="1/8.">1/8. (dotted eighth)</option>
          <option value="1/16">1/16</option>
          <option value="1/32">1/32</option>
          <option value="1/3">1/3 (triplet beat)</option>
          <option value="1/6">1/6 (eighth triplet)</option>
          <option value="1/12">1/12 (sixteenth triplet)</option>
        </select>
      </div>

      <div class="col small">
        <label for="swing">Swing (0..1)</label>
        <input id="swing" type="number" min="0" max="1" step="0.01" value="0.0" />
      </div>

      <div class="col small">
        <label for="capital_shift">Capitals shift</label>
        <select id="capital_shift">
          <option value="up">up</option>
          <option value="down">down</option>
        </select>
      </div>
    </div>

    <div style="margin-top:12px">
      <button id="generate">Generate MIDI</button>
      <button id="example" type="button" style="background:#10b981">Load example</button>
    </div>

    <div id="status" class="note" style="display:none"></div>

    <h3 style="margin-top:18px">How it works</h3>
    <p class="muted">Each character occupies one subdivision slot. Spaces produce rests. Capitals shift octave up/down based on the option. Swing delays every second subdivision by a fraction.</p>
  </div>

<script>
// ----- Scales -----
const SCALES = {
  'major': [0,2,4,5,7,9,11],
  'minor': [0,2,3,5,7,8,10],
  'pentatonic': [0,2,4,7,9],
  'chromatic': [...Array(12).keys()]
};

function parseDivision(div){
  if(div === '1') return 1.0;
  if(div === '1.') return 2/3; // dotted whole -> handled so ticks = ticks_per_beat / (2/3) => 1.5 * ticks
  if(div === '1/2') return 2.0;
  if(div === '1/2.') return 4/3;
  if(div === '1/4') return 4.0;
  if(div === '1/4.') return 8/3;
  if(div === '1/8') return 8.0;
  if(div === '1/8.') return 16/3;
  if(div === '1/16') return 16.0;
  if(div === '1/32') return 32.0;
  if(div === '1/3') return 3.0;
  if(div === '1/6') return 6.0;
  if(div === '1/12') return 12.0;
  const v = parseFloat(div);
  return isFinite(v) ? v : 1.0;
}

function charToNoteInfo(ch, base_midi=60, base_octave=4, scale_name='major', capital_shift='up'){
  const scale = SCALES[scale_name] || SCALES['major'];
  if(ch === ' ' || ch === '\n' || ch === '\t') return {note:null, velocity:0, rest:true};
  if(',;:.!?'.includes(ch)) return {note:null, velocity:0, rest:true};

  let octave_shift = 0;
  if(ch >= 'A' && ch <= 'Z') octave_shift = (capital_shift === 'up') ? 1 : -1;

  let velocity = 64;
  if(ch >= '0' && ch <= '9') velocity = Math.min(127, 64 + parseInt(ch) * 6);

  if((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')){
    const alpha_index = (ch.toLowerCase().charCodeAt(0) - 'a'.charCodeAt(0)) % 26;
    const degree = alpha_index % scale.length;
    const octave = base_octave + Math.floor(alpha_index / scale.length) + octave_shift;
    const midi_note = base_midi + scale[degree] + (octave - base_octave) * 12;
    return {note: midi_note, velocity: velocity, rest:false};
  }

  // other printable chars
  const ord = ch.charCodeAt(0);
  const degree = ord % scale.length;
  const octave = base_octave + ((Math.floor(ord / scale.length)) % 3) + octave_shift;
  const midi_note = base_midi + scale[degree] + (octave - base_octave) * 12;
  return {note: midi_note, velocity: velocity, rest:false};
}

// ----- MIDI byte helpers -----
function writeVarLen(value){
  // returns array of bytes for variable-length quantity
  let buffer = value & 0x7f;
  while((value >>= 7) > 0){
    buffer <<= 8;
    buffer |= ((value & 0x7f) | 0x80);
  }
  const bytes = [];
  while(true){
    bytes.push(buffer & 0xff);
    if(buffer & 0x80) buffer >>= 8; else break;
  }
  return bytes;
}

function u8(n){ return n & 0xff; }
function u16(n){ return [(n>>8)&0xff, n&0xff]; }
function u32(n){ return [(n>>24)&0xff,(n>>16)&0xff,(n>>8)&0xff,n&0xff]; }

// Build a simple single-track MIDI file (type 0) with events provided
function buildMidi(events, opts){
  // events: array of {delta, bytes: [..]}
  // opts: {ticks_per_beat, tempo_micro}
  const header = [];
  header.push(...[0x4d,0x54,0x68,0x64]); // MThd
  header.push(...u32(6));
  header.push(...u16(0)); // format 0
  header.push(...u16(1)); // one track
  header.push(...u16(opts.ticks_per_beat));

  // build track
  const trackData = [];
  for(const ev of events){
    // delta-time as varlen
    trackData.push(...writeVarLen(ev.delta));
    trackData.push(...ev.bytes);
  }
  // end of track meta
  trackData.push(...writeVarLen(0));
  trackData.push(0xFF, 0x2F, 0x00);

  const track = [];
  track.push(...[0x4d,0x54,0x72,0x6b]); // MTrk
  track.push(...u32(trackData.length));
  track.push(...trackData);

  const bytes = new Uint8Array([...header, ...track]);
  return bytes;
}

// Build events from text and parameters
function generateMidiBytesFromText(params){
  const text = params.text;
  const bpm = params.bpm;
  const ticks_per_beat = params.ticks_per_beat;
  const division = params.division;
  const swing = params.swing;
  const base_midi = params.base_midi;
  const base_octave = params.base_octave;
  const scale = params.scale;
  const program = params.program;
  const note_length_beats = params.note_length_beats;
  const capital_shift = params.capital_shift;

  const steps_per_beat = parseDivision(division);
  // note_ticks: ticks per subdivision slot. For dotted values where parseDivision returned <1,
  // we use ticks_per_beat / steps_per_beat. For dotted whole (2/3) this yields 1.5 * ticks.
  const note_ticks_float = ticks_per_beat / steps_per_beat;
  const note_ticks = Math.round(note_ticks_float);
  const note_off_ticks = Math.round(ticks_per_beat * note_length_beats);

  // tempo in microseconds per beat
  const tempo_micro = Math.round(60000000 / bpm);

  // Events array of {delta, bytes[]}
  const events = [];
  // meta: set tempo at start
  events.push({delta:0, bytes:[0xFF, 0x51, 0x03, (tempo_micro>>16)&0xff, (tempo_micro>>8)&0xff, tempo_micro&0xff]});
  // program change
  events.push({delta:0, bytes:[0xC0 | 0x00, program & 0x7f]});

  let scheduled_tick = 0;
  let last_event_tick = 0;
  let event_index = 0;

  for(let i=0;i<text.length;i++){
    const ch = text[i];
    const info = charToNoteInfo(ch, base_midi, base_octave, scale, capital_shift);

    if(info.rest || info.note == null){
      scheduled_tick += note_ticks;
      event_index += 1;
      continue;
    }

    // apply swing: delay odd events
    let swing_delay = 0;
    if(swing && (event_index % 2 === 1)){
      swing_delay = Math.round(note_ticks * swing);
    }

    const event_start = scheduled_tick + swing_delay;
    const delta_to_on = event_start - last_event_tick;
    const note = info.note & 0x7f;
    const vel = info.velocity & 0x7f;

    // note on (0x90 channel 0)
    events.push({delta: delta_to_on, bytes: [0x90, note, vel]});
    // note off after note_off_ticks
    events.push({delta: note_off_ticks, bytes: [0x80, note, 0x00]});

    last_event_tick = event_start + note_off_ticks;
    scheduled_tick += note_ticks;
    event_index += 1;
  }

  // Because buildMidi expects events with their delta values in order, we already pushed them correctly.
  return buildMidi(events, {ticks_per_beat: ticks_per_beat, tempo_micro});
}

// UI wiring
const el = id => document.getElementById(id);
el('generate').addEventListener('click', ()=>{
  el('status').style.display = 'block';
  el('status').textContent = 'Generating...';
  try{
    const params = {
      text: el('text').value,
      bpm: Number(el('bpm').value),
      note_length_beats: Number(el('note_length').value),
      base_midi: Number(el('base_midi').value),
      base_octave: Number(el('base_octave').value),
      scale: el('scale').value,
      program: Number(el('program').value),
      ticks_per_beat: Number(el('ticks').value),
      division: el('division').value,
      swing: Number(el('swing').value),
      capital_shift: el('capital_shift').value
    };

    if(!params.text || params.text.trim().length===0){ alert('Enter some text'); return; }

    const bytes = generateMidiBytesFromText(params);
    const blob = new Blob([bytes], {type:'audio/midi'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = el('output').value || 'output.mid';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    el('status').textContent = 'Done — downloading ' + (el('output').value || 'output.mid');
  }catch(err){
    el('status').textContent = 'Error: ' + err.message;
  }
});

el('example').addEventListener('click', ()=>{
  el('text').value = 'Hello World! This is an example. Use CAPITALS to shift octaves.';
  el('division').value = '1/4';
  el('bpm').value = 110;
  el('swing').value = 0.25;
});
</script>
</body>
</html>
