<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Text → MIDI + Playback (Auto Note Length)</title>
<style>
body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; padding: 24px; background:#f7fafc; }
.card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 6px 18px rgba(2,6,23,0.08); max-width:900px; margin:auto }
label { display:block; margin-top:12px; font-weight:600 }
input[type=text], input[type=number], select, textarea { width:100%; padding:8px 10px; margin-top:6px; border-radius:8px; border:1px solid #e2e8f0 }
.row { display:flex; gap:12px; flex-wrap:wrap }
.col { flex:1 }
.small { max-width:160px }
button { margin-top:16px; background:#2563eb; color:white; padding:10px 14px; border-radius:8px; border:none; cursor:pointer }
button[type="button"]{ background:#10b981; }
.muted { color:#6b7280; font-size:13px }
.note { margin-top:10px; padding:10px; background:#fff7ed; border-radius:8px; border:1px solid #ffedd5 }
</style>
</head>
<body>
<div class="card">
<h1>Text → MIDI + Playback</h1>
<p class="muted">Generate MIDI for download or play it in-browser with synth.</p>

<label for="text">Text to convert</label>
<textarea id="text" rows="6">Hello World! This is a browser-only Text→MIDI demo.</textarea>

<div class="row">
  <div class="col">
    <label for="output">Output filename</label>
    <input id="output" type="text" value="output.mid" />
  </div>
  <div class="col small"><label for="bpm">BPM</label><input id="bpm" type="number" min="20" max="400" value="120" /></div>
  <div class="col small"><label for="note_length">Note length (beats)</label><input id="note_length" type="number" step="0.01" value="0.25" /></div>
</div>

<div class="row">
  <div class="col small"><label for="base_midi">Base MIDI (root)</label><input id="base_midi" type="number" value="36" /></div>
  <div class="col small"><label for="base_octave">Base octave</label><input id="base_octave" type="number" value="1" /></div>
  <div class="col small"><label for="program">Program (instrument)</label><input id="program" type="number" min="0" max="127" value="0" /></div>
  <div class="col small"><label for="ticks">Ticks/beat</label><input id="ticks" type="number" value="480" /></div>
</div>

<div class="row">
  <div class="col">
    <label for="scale">Scale</label>
    <select id="scale">
      <option value="major">major</option>
      <option value="minor">minor</option>
      <option value="pentatonic">pentatonic</option>
      <option value="chromatic">chromatic</option>
    </select>
  </div>
  <div class="col small">
    <label for="division">Division (grid)</label>
    <select id="division">
      <option value="1">1 (whole)</option>
      <option value="1.">1. (dotted whole)</option>
      <option value="1/2">1/2 (half)</option>
      <option value="1/2.">1/2. (dotted half)</option>
      <option value="1/4">1/4 (quarter)</option>
      <option value="1/4.">1/4. (dotted quarter)</option>
      <option value="1/8">1/8 (eighth)</option>
      <option value="1/8.">1/8. (dotted eighth)</option>
      <option value="1/16">1/16</option>
      <option value="1/32">1/32</option>
      <option value="1/3">1/3 (triplet beat)</option>
      <option value="1/6">1/6 (eighth triplet)</option>
      <option value="1/12">1/12 (sixteenth triplet)</option>
    </select>
  </div>
  <div class="col small"><label for="swing">Swing (0..1)</label><input id="swing" type="number" min="0" max="1" step="0.01" value="0.0" /></div>
  <div class="col small"><label for="capital_shift">Capitals shift</label>
    <select id="capital_shift">
      <option value="up">up</option>
      <option value="down">down</option>
    </select>
  </div>
</div>

<h3>Synth Playback Settings</h3>
<div class="row">
  <div class="col small"><label for="oscType">Oscillator type</label>
    <select id="oscType"><option value="sine">Sine</option><option value="square">Square</option><option value="sawtooth">Sawtooth</option><option value="triangle">Triangle</option></select>
  </div>
  <div class="col small"><label for="attack">Attack (s)</label><input type="number" id="attack" step="0.01" value="0.01" min="0"></div>
  <div class="col small"><label for="decay">Decay (s)</label><input type="number" id="decay" step="0.01" value="0.05" min="0"></div>
  <div class="col small"><label for="sustain">Sustain (0-1)</label><input type="number" id="sustain" step="0.01" value="0.7" min="0" max="1"></div>
  <div class="col small"><label for="release">Release (s)</label><input type="number" id="release" step="0.01" value="0.1" min="0"></div>
</div>

<div style="margin-top:12px">
  <button id="generate">Generate MIDI</button>
  <button id="play" type="button" style="background:#f59e0b">Play Synth</button>
  <button id="example" type="button" style="background:#10b981">Load example</button>
</div>
<div id="status" class="note" style="display:none"></div>
</div>

<script>
// --- Utilities ---
function el(id){return document.getElementById(id);}
const SCALES = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], pentatonic:[0,2,4,7,9], chromatic:[...Array(12).keys()] };

function parseDivision(div){
  if(div==='1') return 1.0; if(div==='1.') return 2/3;
  if(div==='1/2') return 2.0; if(div==='1/2.') return 4/3;
  if(div==='1/4') return 4.0; if(div==='1/4.') return 8/3;
  if(div==='1/8') return 8.0; if(div==='1/8.') return 16/3;
  if(div==='1/16') return 16.0; if(div==='1/32') return 32.0;
  if(div==='1/3') return 3.0; if(div==='1/6') return 6.0; if(div==='1/12') return 12.0;
  const v=parseFloat(div); return isFinite(v)?v:1.0;
}

// Map division to default note length in beats
function divisionToDefaultNoteLength(div){
    switch(div){
        case '1': return 1.0;
        case '1.': return 1.5;
        case '1/2': return 0.5;
        case '1/2.': return 0.75;
        case '1/4': return 0.25;
        case '1/4.': return 0.375;
        case '1/8': return 0.125;
        case '1/8.': return 0.1875;
        case '1/16': return 0.0625;
        case '1/32': return 0.03125;
        case '1/3': return 1/3;
        case '1/6': return 1/6;
        case '1/12': return 1/12;
        default: return 0.25;
    }
}

function charToNoteInfo(ch, base_midi=36, base_octave=1, scale_name='major', capital_shift='up'){
  const scale = SCALES[scale_name] || SCALES['major'];
  if(ch===' ' || ch==='\n' || ch==='\t') return {note:null, velocity:0, rest:true};
  if(',;:.!?'.includes(ch)) return {note:null, velocity:0, rest:true};

  let octave_shift=0;
  if(ch>='A' && ch<='Z') octave_shift = capital_shift==='up'?1:-1;
  let velocity=64;
  if(ch>='0' && ch<='9') velocity = Math.min(127,64+parseInt(ch)*6);

  let alpha_index=(ch.toLowerCase().charCodeAt(0)-'a'.charCodeAt(0))%26;
  let degree=0, octave=0;
  if((ch>='a' && ch<='z') || (ch>='A' && ch<='Z')){
    degree=alpha_index%scale.length;
    octave=Math.floor(alpha_index/scale.length)+octave_shift+base_octave;
  } else {
    const ord=ch.charCodeAt(0);
    degree=ord%scale.length;
    octave=(Math.floor(ord/scale.length)%3)+octave_shift+base_octave;
  }
  const midi_note=base_midi + scale[degree] + octave*12;
  return {note:midi_note, velocity:velocity, rest:false};
}

// --- MIDI helpers ---
function writeVarLen(value){let buffer=value&0x7f; while((value>>=7)>0){ buffer<<=8; buffer|=((value&0x7f)|0x80);} const bytes=[]; while(true){ bytes.push(buffer&0xff); if(buffer&0x80) buffer>>=8; else break;} return bytes;}
function u16(n){ return [(n>>8)&0xff,n&0xff]; }
function u32(n){ return [(n>>24)&0xff,(n>>16)&0xff,(n>>8)&0xff,n&0xff]; }

function buildMidi(events, opts){
  const header=[0x4d,0x54,0x68,0x64,...u32(6),0,0,0,1,...u16(opts.ticks_per_beat)];
  const trackData=[];
  for(const ev of events){ trackData.push(...writeVarLen(ev.delta), ...ev.bytes); }
  trackData.push(...writeVarLen(0),0xFF,0x2F,0x00);
  const track=[0x4d,0x54,0x72,0x6b,...u32(trackData.length), ...trackData];
  return new Uint8Array([...header,...track]);
}

function generateMidiBytesFromText(params){
  const {text,bpm,ticks_per_beat,division,swing,base_midi,base_octave,scale,program,note_length_beats,capital_shift}=params;
  const steps_per_beat=parseDivision(division);
  const note_ticks=Math.round(ticks_per_beat/steps_per_beat);
  const note_off_ticks=Math.round(ticks_per_beat*note_length_beats);
  const tempo_micro=Math.round(60000000/bpm);

  const events=[{delta:0,bytes:[0xFF,0x51,0x03,(tempo_micro>>16)&0xff,(tempo_micro>>8)&0xff,tempo_micro&0xff]},{delta:0,bytes:[0xC0|0x00,program&0x7f]}];

  let scheduled_tick=0,last_event_tick=0,event_index=0;

  for(let i=0;i<text.length;i++){
    const ch=text[i];
    const info=charToNoteInfo(ch,base_midi,base_octave,scale,capital_shift);
    if(info.rest || info.note==null){ scheduled_tick+=note_ticks; event_index++; continue; }

    let swing_delay=0;
    if(swing && (event_index%2===1)) swing_delay=Math.round(note_ticks*swing);
    const event_start=scheduled_tick+swing_delay;
    const delta_to_on=event_start-last_event_tick;
    events.push({delta:delta_to_on,bytes:[0x90,info.note&0x7f,info.velocity&0x7f]});
    events.push({delta:note_off_ticks,bytes:[0x80,info.note&0x7f,0x00]});
    last_event_tick=event_start+note_off_ticks;
    scheduled_tick+=note_ticks;
    event_index++;
  }
  return buildMidi(events,{ticks_per_beat,tempo_micro});
}

// --- Playback notes array ---
let playbackNotes=[];

// --- UI ---
el('generate').addEventListener('click', ()=>{
  const params={
    text:el('text').value,
    bpm:Number(el('bpm').value),
    note_length_beats:Number(el('note_length').value),
    base_midi:Number(el('base_midi').value),
    base_octave:Number(el('base_octave').value),
    scale:el('scale').value,
    program:Number(el('program').value),
    ticks_per_beat:Number(el('ticks').value),
    division:el('division').value,
    swing:Number(el('swing').value),
    capital_shift:el('capital_shift').value
  };

  if(!params.text || params.text.trim().length===0){ alert('Enter some text'); return; }

  const bytes=generateMidiBytesFromText(params);
  const blob=new Blob([bytes],{type:'audio/midi'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=el('output').value||'output.mid'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

  // --- Prepare playback notes ---
  playbackNotes=[];
  const secondsPerBeat = 60/params.bpm;
  const ticksPerBeat = params.ticks_per_beat;
  const stepsPerBeat = parseDivision(params.division);
  const tickDuration = secondsPerBeat / ticksPerBeat;
  let scheduledTick = 0;
  let eventIndex = 0;

  for (let ch of params.text) {
    const info = charToNoteInfo(ch, params.base_midi, params.base_octave, params.scale, params.capital_shift);
    const noteTicks = Math.round(ticksPerBeat * params.note_length_beats);
    let swingDelay = 0;
    if(params.swing && (eventIndex%2===1)) swingDelay = Math.round(ticksPerBeat*params.swing);
    const startTick = scheduledTick + swingDelay;
    if(info && !info.rest){
      playbackNotes.push({
        note: info.note,
        startTime: startTick * tickDuration,
        duration: noteTicks * tickDuration,
        velocity: info.velocity / 127
      });
    }
    scheduledTick += Math.round(ticksPerBeat/stepsPerBeat);
    eventIndex++;
  }

  el('status').style.display='block';
  el('status').textContent='Done — MIDI downloaded & playback ready!';
});

// --- Play synth ---
el('play').addEventListener('click', ()=>{
  if(playbackNotes.length===0){ alert('Generate MIDI first!'); return; }
  const context=new (window.AudioContext||window.webkitAudioContext)();
  const oscType=el('oscType').value;
  const attack=Number(el('attack').value);
  const decay=Number(el('decay').value);
  const sustain=Number(el('sustain').value);
  const release=Number(el('release').value);
  const startTime=context.currentTime;

  playbackNotes.forEach(n=>{
    const osc=context.createOscillator();
    osc.type=oscType;
    osc.frequency.value=440*Math.pow(2,(n.note-69)/12);
    const gain=context.createGain();
    gain.gain.setValueAtTime(0,startTime+n.startTime);
    gain.gain.linearRampToValueAtTime(n.velocity,startTime+n.startTime+attack);
    gain.gain.linearRampToValueAtTime(n.velocity*sustain,startTime+n.startTime+attack+decay);
    gain.gain.setValueAtTime(n.velocity*sustain,startTime+n.startTime+n.duration);
    gain.gain.linearRampToValueAtTime(0,startTime+n.startTime+n.duration+release);
    osc.connect(gain).connect(context.destination);
    osc.start(startTime+n.startTime);
    osc.stop(startTime+n.startTime+n.duration+release+0.01);
  });
});

// --- Example button ---
el('example').addEventListener('click', ()=>{
  el('text').value='Hello World! This is an example. Use CAPITALS to shift octaves.';
  el('division').value='1/4';
  el('bpm').value=110;
  el('swing').value=0.25;
  el('note_length').value=divisionToDefaultNoteLength('1/4');
});

// --- Auto-update note length on division change ---
el('division').addEventListener('change', ()=>{
    el('note_length').value = divisionToDefaultNoteLength(el('division').value);
});

// --- Initialize note length ---
el('note_length').value = divisionToDefaultNoteLength(el('division').value);

</script>
</body>
</html>
